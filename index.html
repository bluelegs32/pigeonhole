<h1>Pigeonhole</h1>
<p>Pigeonhole is an iPhone email app for Gmail and iCloud Mail, with a Smart Inbox, auto-routing rules, swipe actions, templates, and optional AI using your own key.</p>
<p>It reads, sorts, sends, and organizes the signed-in person's own email.</p>
